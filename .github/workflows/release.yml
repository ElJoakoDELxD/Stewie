name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write

jobs:
  release:
    if: >-
      github.repository == 'ElJoakoDELxD/Stewie'
      && github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.head_branch == 'main'
      && github.event.workflow_run.event != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Tag and release the version CHANGELOG.md names
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          v="$(sed -n 's/^## \([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\).*/\1/p' CHANGELOG.md | head -1)"
          if git rev-parse -q --verify "refs/tags/v${v}" >/dev/null; then
            echo "v${v} is already released."; exit 0
          fi
          awk -v v="${v}" 'index($0, "## " v) == 1 { f = 1; next } /^## / && f { exit } f' CHANGELOG.md > "${RUNNER_TEMP}/notes.md"
          gh release create "v${v}" --target "${SHA}" --title "Stewie ${v}" --notes-file "${RUNNER_TEMP}/notes.md"
